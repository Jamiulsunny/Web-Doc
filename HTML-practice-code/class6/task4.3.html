<!DOCTYPE html>
<html>
<head><title>Contact Us</title></head>
<body>
  <h1>আমাদের সাথে যোগাযোগ</h1>
  <p>নিচের form পূরণ করুন, আমরা ২৪ ঘণ্টার মধ্যে সাড়া দেব।</p>

  <form action="/contact" method="POST">
    <fieldset>
      <legend>আপনার তথ্য</legend>

      <p>
        <label for="name">পুরো নাম *</label><br />
        <input type="text" id="name" name="name" required minlength="3" placeholder="John Doe" />
      </p>

      <p>
        <label for="email">Email *</label><br />
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </p>

      <p>
        <label for="phone">ফোন</label><br />
        <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="01700000000" />
      </p>
    </fieldset>

    <fieldset>
      <legend>বার্তা</legend>

      <p>
        <label for="subject">বিষয়:</label><br />
        <select id="subject" name="subject" required>
          <option value="">-- বেছে নিন --</option>
          <option value="general">সাধারণ প্রশ্ন</option>
          <option value="support">Technical Support</option>
          <option value="feedback">Feedback</option>
        </select>
      </p>

      <p>
        <label for="msg">আপনার বার্তা *</label><br />
        <textarea id="msg" name="msg" rows="5" cols="40" required minlength="10"></textarea>
      </p>
    </fieldset>

    <button type="submit">পাঠান</button>
    <button type="reset">Clear</button>
  </form>
</body>
</html>
