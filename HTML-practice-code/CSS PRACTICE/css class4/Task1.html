<!DOCTYPE html>
<html>
<head>
  <title>Hero</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .hero {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      height: 100vh; text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    h1 { font-size: 48px; margin: 0 0 10px; }
    p { font-size: 18px; margin: 0 0 24px; }
    .btn { padding: 12px 32px; background: white; color: #764ba2; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Welcome to My App</h1>
    <p>Flexbox দিয়ে perfectly center!</p>
    <a href="#" class="btn">Get Started</a>
  </section>
</body>
</html>
