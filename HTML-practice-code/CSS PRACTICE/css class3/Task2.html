<!DOCTYPE html>
<html>
  <head>
    <title>Product Card</title>
    <style>
      body { background: #f5f5f5; font-family: sans-serif; padding: 40px; }
      .card {
        width: 280px;
        background: white;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
        margin: 0 auto;
        text-align: center;
      }
      .card img { width: 100%; border-radius: 6px; }
      .price { color: #d9534f; font-weight: bold; font-size: 20px; }
      .btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://picsum.photos/300/200" alt="p" />
      <h3>Wireless Headphone</h3>
      <p class="price">৳ 2,500</p>
      <a href="#" class="btn">Buy Now</a>
    </div>
  </body>
</html>
