<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Playground</title>

    <style> 
        body {
            background: #eef;
            padding: 20px;
            font-family: sans-serif;
        }

        .box {
            width: 200px;
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .a {
            background-color: tomato;
            border: 4px solid darkred;
        }

        .b {
            background: teal;
            border-radius: 12px;
        }

        .c {
            background: #444;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="box a">Border Box</div>
    <div class="box b">Rounded Box</div>
    <div class="box c">Shadow Box</div>
</body>
</html>
