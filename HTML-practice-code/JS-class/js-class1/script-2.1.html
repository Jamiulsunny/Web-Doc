<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre id="out" style="font:50px/2.5 monospace; padding:16px;background:#f5f5f5"></pre>
    <script>
        const log = (m) => document.getElementById("out").textContent += m + "\n";
        let age =20;
        log("Age First: " + age);
        age = 30;
        log("Age Second: " + age);
        const pi = 3.14;
        log("Pi (constant): " + pi);
        try {
            pi = 3.14159;
        } catch (e) {
            log("const Bodlano jaina : " + e.message);
        }
    </script>
</body>
</html>
