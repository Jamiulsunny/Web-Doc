<!DOCTYPE html>
<html>
<body>
<pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#33a035">
</pre>
<script>
  const log = (m) => document.getElementById("out").textContent += m + "\n";
  log("10 + 5 = " + (10 + 5));
  log("10 % 3 = " + (10 % 3));
  log("5 === '5' -> " + (5 === "5"));
  log("5 === 5 -> " + (5 === 5));
  log("true && false -> " + (true && false));
  log("true || false -> " + (true || false));
</script>
</body>
</html>
