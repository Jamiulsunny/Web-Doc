<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NEXUS CALC — Premium Dark Calculator Web Application" />
  <title>NEXUS CALC | Precision Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calc-wrapper">
    <section class="calculator" aria-label="Electronic Calculator">
      
      <!-- Top Brand Header -->
      <header class="calc-header">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="2" width="16" height="20" rx="3" />
            <line x1="8" y1="6" x2="16" y2="6" />
            <line x1="16" y1="14" x2="16" y2="18" />
            <path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01" />
          </svg>
          <span class="brand-name">NEXUS CALC (JS.) </span>
        </div>
        <div class="mode-badge" id="modeBadge">PRECISION MODE</div>
      </header>

      <!-- Display Section -->
      <section class="calc-screen" aria-live="polite">
        <div class="expression-line" id="expressionDisplay" aria-label="Previous expression">&nbsp;</div>
        <div class="current-line" id="mainDisplay" tabindex="0" role="textbox" aria-readonly="true" aria-label="Current value">0</div>
      </section>

      <!-- Keypad Grid -->
      <div class="calc-keypad" role="group" aria-label="Calculator Keypad">
        <!-- Row 1 -->
        <button type="button" class="btn btn-action" data-action="clear" aria-label="Clear All">AC</button>
        <button type="button" class="btn btn-action" data-action="delete" aria-label="Delete last digit">⌫</button>
        <button type="button" class="btn btn-operator" data-action="percent" aria-label="Percentage">%</button>
        <button type="button" class="btn btn-operator" data-op="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-num" data-num="7">7</button>
        <button type="button" class="btn btn-num" data-num="8">8</button>
        <button type="button" class="btn btn-num" data-num="9">9</button>
        <button type="button" class="btn btn-operator" data-op="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-num" data-num="4">4</button>
        <button type="button" class="btn btn-num" data-num="5">5</button>
        <button type="button" class="btn btn-num" data-num="6">6</button>
        <button type="button" class="btn btn-operator" data-op="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-num" data-num="1">1</button>
        <button type="button" class="btn btn-num" data-num="2">2</button>
        <button type="button" class="btn btn-num" data-num="3">3</button>
        <button type="button" class="btn btn-operator" data-op="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-utility" data-action="negate" aria-label="Toggle negative or positive">±</button>
        <button type="button" class="btn btn-num" data-num="0">0</button>
        <button type="button" class="btn btn-utility" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="btn btn-equals" data-action="equals" aria-label="Calculate equals">=</button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
