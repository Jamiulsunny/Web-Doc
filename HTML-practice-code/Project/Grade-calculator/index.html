<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA — Premium Grade Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 23, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Dynamic Accent Theme - Default Vibrant Indigo */
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --badge-bg: rgba(99, 102, 241, 0.15);
      
      /* Grading Palette */
      --grade-aplus: #10b981;  /* Emerald */
      --grade-a: #06b6d4;      /* Cyan */
      --grade-b: #3b82f6;      /* Blue */
      --grade-c: #f59e0b;      /* Amber */
      --grade-d: #f97316;      /* Orange */
      --grade-f: #ef4444;      /* Crimson */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Animated Glow Pods */
    .blob {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.8s ease;
    }
    .blob-1 {
      top: 15%;
      left: 20%;
      background: var(--accent-glow);
    }
    .blob-2 {
      bottom: 15%;
      right: 20%;
      background: rgba(236, 72, 153, 0.15);
    }

    /* Calculator Main Container */
    .calc-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--badge-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-glow);
      transition: all 0.5s ease;
    }

    .title-area h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 4px;
    }

    .title-area p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Input Field Container */
    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mark-input {
      width: 100%;
      height: 60px;
      background: rgba(11, 15, 25, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 0 54px 0 20px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .mark-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      background: rgba(11, 15, 25, 0.95);
    }

    .input-suffix {
      position: absolute;
      right: 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Action Button */
    .calc-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-color), #4338ca);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.5s ease;
    }

    .calc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px var(--accent-glow);
    }

    .calc-btn:active {
      transform: scale(0.97);
    }

    /* Output / Results Card */
    .result-display {
      background: rgba(11, 15, 25, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 140px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .result-display.empty {
      color: var(--text-muted);
      font-size: 14px;
    }

    .result-grade {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .result-msg {
      font-size: 16px;
      font-weight: 600;
    }

    .result-status-tag {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Dynamic Outcome Colors */
    .result.pass {
      border-style: solid;
    }
    .result.fail {
      border-style: solid;
      border-color: var(--grade-f) !important;
      background: rgba(239, 68, 68, 0.08) !important;
    }
    .result.fail .result-grade,
    .result.fail .result-msg {
      color: var(--grade-f);
    }
    .result.fail .result-status-tag {
      background: rgba(239, 68, 68, 0.2);
      color: var(--grade-f);
    }

    /* Quick Grading Scale Overview */
    .grading-pills {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 2px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .pill span {
      font-size: 9px;
      font-weight: 400;
      opacity: 0.7;
    }

    .pill.active {
      transform: translateY(-2px);
      color: #fff;
      border-color: var(--accent-color);
      background: var(--badge-bg);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Canvas for Confetti */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="blob blob-1" id="ambientBlob"></div>
  <div class="blob blob-2"></div>
  <canvas id="confettiCanvas"></canvas>

  <main class="calc-card">
    <div class="card-header">
      <div class="title-area">
        <span class="badge-label" id="systemBadge">Academic System</span>
        <h1>Grade Analyzer</h1>
        <p>নম্বর দিয়ে তাৎক্ষণিক ফলাফল দেখুন</p>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-label">
        <span>প্রাপ্ত নম্বর লিখুন</span>
        <span>রেঞ্জ: ০ — ১০০</span>
      </div>
      <div class="input-container">
        <input 
          type="number" 
          id="mark" 
          class="mark-input" 
          placeholder="e.g. 85" 
          min="0" 
          max="100" 
          autofocus 
          autocomplete="off"
        />
        <span class="input-suffix">/ 100</span>
      </div>
    </div>

    <button id="btn" class="calc-btn">
      <span>গ্রেড গণনা করুন</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>

    <!-- Result Area -->
    <div id="out" class="result-display empty">
      নম্বর ইনপুট দিয়ে বাটনে ক্লিক করুন
    </div>

    <!-- Quick Reference Legend -->
    <div class="grading-pills" id="pillsContainer">
      <div class="pill" data-grade="A+">A+<span>80+</span></div>
      <div class="pill" data-grade="A">A<span>70+</span></div>
      <div class="pill" data-grade="B">B<span>60+</span></div>
      <div class="pill" data-grade="C">C<span>50+</span></div>
      <div class="pill" data-grade="D">D<span>33+</span></div>
      <div class="pill" data-grade="F">F<span>&lt;33</span></div>
    </div>
  </main>

  <script>
    // 1. Element নির্বাচন
    const input = document.getElementById("mark");
    const btn = document.getElementById("btn");
    const out = document.getElementById("out");
    const ambientBlob = document.getElementById("ambientBlob");
    const systemBadge = document.getElementById("systemBadge");
    const pills = document.querySelectorAll(".pill");
    const confettiCanvas = document.getElementById("confettiCanvas");
    const ctx = confettiCanvas.getContext("2d");

    // Dynamic Theme Palettes per Grade
    const GradePalettes = {
      "A+": { color: "#10b981", glow: "rgba(16, 185, 129, 0.4)", gradient: "linear-gradient(135deg, #10b981, #059669)" },
      "A":  { color: "#06b6d4", glow: "rgba(6, 182, 212, 0.4)", gradient: "linear-gradient(135deg, #06b6d4, #0891b2)" },
      "B":  { color: "#3b82f6", glow: "rgba(59, 130, 246, 0.4)", gradient: "linear-gradient(135deg, #3b82f6, #2563eb)" },
      "C":  { color: "#f59e0b", glow: "rgba(245, 158, 11, 0.4)", gradient: "linear-gradient(135deg, #f59e0b, #d97706)" },
      "D":  { color: "#f97316", glow: "rgba(249, 115, 22, 0.4)", gradient: "linear-gradient(135deg, #f97316, #ea580c)" },
      "F":  { color: "#ef4444", glow: "rgba(239, 68, 68, 0.4)", gradient: "linear-gradient(135deg, #ef4444, #dc2626)" },
      "ERR":{ color: "#f43f5e", glow: "rgba(244, 63, 94, 0.4)", gradient: "linear-gradient(135deg, #f43f5e, #be123c)" }
    };

    // 2. Grade বের করার Core Function
    function getGrade(m) {
      if (m >= 80) return { g: "A+", pass: true, msg: "চমৎকার!" }; //
      if (m >= 70) return { g: "A", pass: true, msg: "খুব ভালো!" }; //
      if (m >= 60) return { g: "B", pass: true, msg: "ভালো" }; //
      if (m >= 50) return { g: "C", pass: true, msg: "আরো effort লাগবে" }; //
      if (m >= 33) return { g: "D", pass: true, msg: "কোনোরকম pass!" }; //
      return { g: "F", pass: false, msg: "Fail - আবার চেষ্টা করো!" }; //
    }

    // Apply Dynamic UI Theme
    function setTheme(gradeKey) {
      const theme = GradePalettes[gradeKey] || GradePalettes["ERR"];
      document.documentElement.style.setProperty('--accent-color', theme.color);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      document.documentElement.style.setProperty('--badge-bg', `${theme.color}20`);
      btn.style.background = theme.gradient;
      ambientBlob.style.background = theme.glow;

      // Update pills
      pills.forEach(p => {
        p.classList.toggle("active", p.dataset.grade === gradeKey);
      });
    }

    // 3. Button Click Event
    btn.addEventListener("click", () => {
      const m = Number(input.value); //

      // Validation Check
      if (input.value.trim() === "" || Number.isNaN(m) || m < 0 || m > 100) { //
        setTheme("ERR");
        out.className = "result-display result fail"; //
        out.innerHTML = `
          <div class="result-grade" style="font-size: 32px;">⚠️</div>
          <div class="result-msg">0-100 এর মধ্যে দাও</div>
        `; //
        return; //
      }

      const r = getGrade(m); //
      setTheme(r.g);

      // Render Display
      out.className = "result-display result " + (r.pass ? "pass" : "fail"); //
      out.style.borderColor = GradePalettes[r.g].color;
      out.style.background = `${GradePalettes[r.g].color}0d`;

      out.innerHTML = `
        <div class="result-grade" style="color: ${GradePalettes[r.g].color};">${r.g}</div>
        <div class="result-msg" style="color: #fff;">${r.msg}</div>
        <div class="result-status-tag" style="background: ${GradePalettes[r.g].color}25; color: ${GradePalettes[r.g].color};">
          ${r.pass ? 'STATUS: PASSED' : 'STATUS: RETAKE REQUIRED'}
        </div>
      `;

      // Trigger Confetti Celebration for A+
      if (r.g === "A+") {
        launchConfetti();
      }
    });

    // 4. Enter Key Support
    input.addEventListener("keydown", (e) => { //
      if (e.key === "Enter") btn.click(); //
    });

    // Confetti Animation Canvas
    let particles = [];
    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      particles = [];
      const colors = ['#10b981', '#34d399', '#6ee7b7', '#f59e0b', '#3b82f6'];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height / 2 + 50,
          w: Math.random() * 8 + 4,
          h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 16,
          gravity: 0.35,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          alpha: 1
        });
      }
      animateConfetti();
    }

    let animId = null;
    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.012;

        ctx.save();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) {
        animId = requestAnimationFrame(animateConfetti);
      } else {
        cancelAnimationFrame(animId);
      }
    }
  </script>
</body>
</html>
